name: Publish PyPI Package

# Publishes `argorix-guardrails-agent` on a `v*` tag. The deprecated
# `governanceai-guardrails-agent` shim is published by publish-pypi-compat.yml.
#
# Requires PyPI trusted publishing configured for this repository:
#   PyPI > argorix-guardrails-agent > Publishing > Add a new pending publisher
#     owner: argorixlabs / repo: argorix-guardrails-agent
#     workflow: publish-pypi.yml / environment: pypi
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          # During the rebrand rollout `argorix` may not be on PyPI yet. Fall back to the
          # sibling repository so a release here is not blocked on the release order.
          pip install "argorix>=0.2.0" \
            || pip install "argorix @ git+https://github.com/argorixlabs/argorix-python@main"
          python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest tests -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/argorix-guardrails-agent
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Fail if the tag does not match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
